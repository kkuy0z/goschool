<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro institucional | GoSchool</title>
</head>
<body>
  <main>
    <a href="/adm.html">Voltar ao painel</a>
    <h1>Cadastro institucional</h1>
    <p>Somente a Coordenação pode cadastrar usuários. O acesso é feito posteriormente com a conta Google institucional; não há senha local.</p>
    <p id="status" role="status" aria-live="polite"></p>

    <form id="enrollment-form">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" autocomplete="name" minlength="2" maxlength="160" required>

      <label for="email">E-mail institucional</label>
      <input id="email" name="email" type="email" autocomplete="off" maxlength="254" placeholder="nome@aluno.mg.gov.br" required>

      <label for="tipo">Perfil</label>
      <select id="tipo" name="tipo" required>
        <option value="">Selecione</option>
        <option value="aluno">Aluno</option>
        <option value="professor">Professor</option>
        <option value="adm">Administrador / Coordenação</option>
      </select>

      <fieldset id="guardian-fields" hidden>
        <legend>Consentimento do responsável legal</legend>
        <label for="responsavelNome">Nome do responsável</label>
        <input id="responsavelNome" name="responsavelNome" maxlength="160">
        <label for="responsavelVinculo">Vínculo com o aluno</label>
        <input id="responsavelVinculo" name="responsavelVinculo" maxlength="100" placeholder="Mãe, pai, tutor legal...">
        <label>
          <input id="consentimento" name="consentimento" type="checkbox">
          Confirmo que o consentimento do responsável legal foi obtido e registrado pela instituição.
        </label>
        <p>O perfil de aluno só pode ser ativado após o registro do consentimento.</p>
      </fieldset>

      <button type="submit" id="submit-button">Cadastrar usuário</button>
    </form>
  </main>
  <script src="/cadastro.js" defer></script>
</body>
</html>
