<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoSchool | Reservas</title>
<link rel="stylesheet" href="/design-system.css"><link rel="stylesheet" href="/reservas.css"><script src="/auth.js"></script>
<style>
body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:#0f172a66;backdrop-filter:blur(7px)}
.reserva-shell{width:min(1120px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--gs-background,#fff);border:1px solid var(--gs-border,#ddd);border-radius:20px;box-shadow:0 24px 80px #0004}
.reserva-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;background:var(--gs-surface,#fff);border-bottom:1px solid var(--gs-border,#ddd)}
.reserva-head h1{margin:0;font-size:1.5rem}.reserva-head p{margin:5px 0 0;color:var(--gs-text-secondary)}
.reserva-body{padding:22px}.reserva-list{display:grid;gap:12px}.reserva-card{display:flex;justify-content:space-between;gap:16px;padding:16px;border:1px solid var(--gs-border);border-radius:14px;background:var(--gs-surface)}.reserva-card h3{margin:0 0 6px}.reserva-card p{margin:4px 0;color:var(--gs-text-secondary)}
.reserva-status{display:inline-block;padding:4px 9px;border-radius:30px;background:#fef3c7;color:#92400e;font-size:.8rem;font-weight:700}.CONFIRMADA{background:#dcfce7;color:#166534}.CANCELADA,.REJEITADA{background:#fee2e2;color:#991b1b}
.reserva-empty{padding:28px;text-align:center;border:1px dashed var(--gs-border);border-radius:12px;color:var(--gs-text-secondary)}
.reserva-modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:#0b1220aa;backdrop-filter:blur(5px)}.reserva-modal[hidden]{display:none}
.reserva-modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--gs-surface,#fff);border:1px solid var(--gs-border);border-radius:18px;box-shadow:0 20px 70px #0004}
.reserva-modal-head,.reserva-modal-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--gs-border)}.reserva-modal-foot{border:0;border-top:1px solid var(--gs-border);justify-content:flex-end}.reserva-form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.reserva-form label{display:grid;gap:6px}.reserva-form .wide{grid-column:1/-1}.reserva-form input,.reserva-form select,.reserva-form textarea{width:100%;box-sizing:border-box}.reserva-admin{margin-top:22px;padding:18px;border:1px solid var(--gs-border);border-radius:14px}.reserva-admin form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reserva-admin label{display:grid;gap:5px}
@media(max-width:650px){body{padding:8px}.reserva-shell{max-height:calc(100vh - 16px)}.reserva-head{padding:15px;flex-wrap:wrap}.reserva-body{padding:14px}.reserva-form,.reserva-admin form{grid-template-columns:1fr}.reserva-form .wide{grid-column:auto}.reserva-card{flex-direction:column}}
</style></head><body>
<section class="reserva-shell" role="dialog" aria-modal="true" aria-labelledby="title">
<header class="reserva-head"><div><h1 id="title">Reservas de ambientes</h1><p>Solicite e acompanhe a utilização dos espaços escolares.</p></div><div><a class="btn-secondary" id="back" href="/professor.html">← Voltar ao painel</a> <button class="btn-primary" id="new" type="button">＋ Nova reserva</button></div></header>
<main class="reserva-body"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px"><span id="hello">Suas reservas</span><button class="btn-secondary" id="refresh" type="button">↻ Atualizar</button></div><div class="reserva-list" id="list"><div class="reserva-empty">Carregando reservas…</div></div>
<section class="reserva-admin" id="admin" hidden><h2>Cadastrar ambiente</h2><form id="resourceForm"><label>Nome *<input class="form-input" id="rname" required maxlength="160"></label><label>Localização<input class="form-input" id="rlocation" maxlength="180"></label><label>Capacidade<input class="form-input" id="rcapacity" type="number" min="1"></label><label>Descrição<input class="form-input" id="rdesc" maxlength="500"></label><button class="btn-primary" type="submit">Cadastrar ambiente</button><span id="rmessage" role="status"></span></form></section>
</main></section>
<div class="reserva-modal" id="modal" hidden><section class="reserva-modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="reserva-modal-head"><h2 id="modalTitle">Solicitar reserva</h2><button class="modal-close" id="close" type="button" aria-label="Fechar">×</button></header><form id="form"><div class="reserva-form"><label class="wide">Ambiente *<select class="form-select" id="resource" required><option value="">Selecione</option></select></label><label class="wide">Título/atividade *<input class="form-input" id="titleInput" required maxlength="180"></label><label>Início *<input class="form-input" id="start" type="datetime-local" required></label><label>Término *<input class="form-input" id="end" type="datetime-local" required></label><label class="wide">Finalidade / observações<textarea class="form-input" id="purpose" rows="3" maxlength="4000"></textarea></label><div class="wide" id="message" role="alert"></div></div><footer class="reserva-modal-foot"><button class="btn-secondary" id="dismiss" type="button">Fechar</button><button class="btn-primary" id="submit" type="submit">Enviar solicitação</button></footer></form></section></div>
<script>
(function(){
const $=id=>document.getElementById(id);let user=null;
const api=(url,opt)=>Auth.apiCall(url,Object.assign({headers:{"Content-Type":"application/json"}},opt||{}));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>{if(!s)return "—";let d=new Date(String(s).replace(" ","T"));return isNaN(d)?esc(s):d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});};
const label=s=>({PENDENTE:"Pendente",CONFIRMADA:"Confirmada",REJEITADA:"Rejeitada",CANCELADA:"Cancelada",ERRO:"Erro"}[s]||s);
async function resources(){let r=await api("/api/reservas/recursos"),d=await r.json();if(!r.ok||!d.sucesso)throw Error(d.erro||"Falha ao carregar ambientes");$("resource").innerHTML='<option value="">Selecione um ambiente</option>'+(d.recursos||[]).map(x=>'<option value="'+x.id+'">'+esc(x.nome)+(x.localizacao?" — "+esc(x.localizacao):"")+"</option>").join("");}
async function load(){let r=await api("/api/reservas"),d=await r.json();if(!r.ok||!d.sucesso)throw Error(d.erro||"Falha ao carregar reservas");let rows=d.reservas||[];$("list").innerHTML=rows.length?rows.map(x=>'<article class="reserva-card"><div><h3>'+esc(x.titulo)+" · "+esc(x.recurso_nome)+'</h3><p>'+esc(x.localizacao||"Local não informado")+" · "+dt(x.data_inicio)+" até "+dt(x.data_fim)+'</p><p>'+esc(x.finalidade||"Sem observações")+(user&&user.tipo==="adm"?" · Solicitante: "+esc(x.usuario_nome):"")+'</p><span class="reserva-status '+esc(x.status)+'">'+label(x.status)+'</span></div>'+(["PENDENTE","CONFIRMADA"].includes(x.status)?'<button class="btn-secondary" data-cancel="'+x.id+'">Cancelar</button>':"")+"</article>").join(""):'<div class="reserva-empty">Nenhuma reserva encontrada.</div>';$("list").querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{if(!confirm("Cancelar esta reserva?"))return;let c=await api("/api/reservas/"+b.dataset.cancel,{method:"DELETE"}),j=await c.json();if(!c.ok||!j.sucesso)alert(j.erro||"Falha ao cancelar");await load();});}
function close(){ $("modal").hidden=true; }$("new").onclick=()=>{$("message").textContent="";$("form").reset();$("modal").hidden=false;};$("close").onclick=close;$("dismiss").onclick=close;$("modal").onclick=e=>{if(e.target===$("modal"))close();};$("refresh").onclick=()=>load().catch(e=>$("list").textContent=e.message);
$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("message").textContent="";try{let r=await api("/api/reservas",{method:"POST",body:JSON.stringify({recurso_id:Number($("resource").value),titulo:$("titleInput").value.trim(),data_inicio:$("start").value,data_fim:$("end").value,finalidade:$("purpose").value.trim()})}),d=await r.json();if(!r.ok||!d.sucesso)throw Error(d.erro||"Não foi possível solicitar");close();await load();alert(d.mensagem||"Solicitação enviada");}catch(e){$("message").textContent=e.message;}finally{$("submit").disabled=false;}};
$("resourceForm").onsubmit=async e=>{e.preventDefault();try{let r=await api("/api/reservas/recursos",{method:"POST",body:JSON.stringify({nome:$("rname").value.trim(),localizacao:$("rlocation").value.trim(),capacidade:$("rcapacity").value||null,descricao:$("rdesc").value.trim()})}),d=await r.json();if(!r.ok||!d.sucesso)throw Error(d.erro||"Falha ao cadastrar");$("resourceForm").reset();$("rmessage").textContent="Ambiente cadastrado.";await resources();}catch(e){$("rmessage").textContent=e.message;}};
document.addEventListener("DOMContentLoaded",async()=>{if(!await Auth.init({requireAuth:true,allowedRoles:["professor","adm"]}))return;try{let me=await api("/api/me"),d=await me.json();user=d.usuario||null;if(user){$("hello").textContent="Olá, "+user.nome+".";if(user.tipo==="adm"){$("admin").hidden=false;$("back").href="/adm.html";}}await resources();await load();setInterval(()=>load().catch(()=>{}),5000);}catch(e){$("list").textContent=e.message;}});
})();
</script></body></html>
